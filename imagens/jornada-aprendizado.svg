<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" role="img" aria-labelledby="jornadaTitulo">
  <title id="jornadaTitulo">Linha do tempo com quatro etapas da jornada de aprendizado em Front-End</title>

  <rect x="0" y="0" width="600" height="220" fill="#f1f5f9"/>

  <line x1="75" y1="110" x2="525" y2="110" stroke="#1e3a5f" stroke-width="4"/>

  <g font-family="Arial, sans-serif" font-size="14" text-anchor="middle">
    <circle cx="75" cy="110" r="34" fill="#1e3a5f"/>
    <text x="75" y="116" fill="#ffffff" font-size="20">1</text>
    <text x="75" y="168" fill="#1e293b" font-weight="bold">Planejar</text>

    <circle cx="225" cy="110" r="34" fill="#2f6690"/>
    <text x="225" y="116" fill="#ffffff" font-size="20">2</text>
    <text x="225" y="168" fill="#1e293b" font-weight="bold">Estruturar</text>

    <circle cx="375" cy="110" r="34" fill="#3a7ca5" />
    <text x="375" y="116" fill="#ffffff" font-size="20">3</text>
    <text x="375" y="168" fill="#1e293b" font-weight="bold">Estilizar</text>

    <circle cx="525" cy="110" r="34" fill="#16a34a"/>
    <text x="525" y="116" fill="#ffffff" font-size="20">4</text>
    <text x="525" y="168" fill="#1e293b" font-weight="bold">Publicar</text>
  </g>
</svg>

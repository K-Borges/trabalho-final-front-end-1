<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" role="img" aria-labelledby="codigoTitulo">
  <title id="codigoTitulo">Janela de editor de código com marcação HTML e CSS</title>

  <rect x="0" y="0" width="500" height="340" rx="14" fill="#1e293b"/>

  <rect x="0" y="0" width="500" height="36" rx="14" fill="#0f172a"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="18" r="6" fill="#27c93f"/>
  <text x="250" y="23" fill="#94a3b8" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">index.html</text>

  <g font-family="Consolas, monospace" font-size="15">
    <text x="24" y="66" fill="#64748b">1</text>
    <text x="50" y="66" fill="#38bdf8">&lt;!DOCTYPE html&gt;</text>

    <text x="24" y="90" fill="#64748b">2</text>
    <text x="50" y="90" fill="#38bdf8">&lt;html lang="pt-BR"&gt;</text>

    <text x="24" y="114" fill="#64748b">3</text>
    <text x="66" y="114" fill="#38bdf8">&lt;head&gt;</text>

    <text x="24" y="138" fill="#64748b">4</text>
    <text x="82" y="138" fill="#facc15">&lt;link rel="stylesheet" href="style.css"&gt;</text>

    <text x="24" y="162" fill="#64748b">5</text>
    <text x="66" y="162" fill="#38bdf8">&lt;/head&gt;</text>

    <text x="24" y="186" fill="#64748b">6</text>
    <text x="50" y="186" fill="#38bdf8">&lt;body&gt;</text>

    <text x="24" y="210" fill="#64748b">7</text>
    <text x="82" y="210" fill="#4ade80">&lt;h1&gt;</text>
    <text x="128" y="210" fill="#e2e8f0">Meu Projeto Web</text>
    <text x="290" y="210" fill="#4ade80">&lt;/h1&gt;</text>

    <text x="24" y="234" fill="#64748b">8</text>
    <text x="50" y="234" fill="#38bdf8">&lt;/body&gt;</text>

    <text x="24" y="258" fill="#64748b">9</text>
    <text x="50" y="258" fill="#38bdf8">&lt;/html&gt;</text>
  </g>

  <rect x="24" y="278" width="452" height="40" rx="6" fill="#0f172a"/>
  <text x="40" y="303" fill="#4ade80" font-family="Consolas, monospace" font-size="14">h1 { color: darkblue; text-align: center; }</text>
</svg>
